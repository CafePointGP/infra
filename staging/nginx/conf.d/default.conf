# Rate limiting zones
limit_req_zone $binary_remote_addr zone=general:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;

# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name staging.cafepointgp.club api-staging.cafepointgp.club;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Frontend
server {
    listen 443 ssl;
    server_name staging.cafepointgp.club;

    ssl_certificate /etc/nginx/ssl/live/staging.cafepointgp.club/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/staging.cafepointgp.club/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API
server {
    listen 443 ssl;
    server_name api-staging.cafepointgp.club;

    ssl_certificate /etc/nginx/ssl/live/staging.cafepointgp.club/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/staging.cafepointgp.club/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/auth {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check (sem rate limit)
    location /health {
        proxy_pass http://api:5000/health;
    }
}
